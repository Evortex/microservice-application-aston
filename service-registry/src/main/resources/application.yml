server:
  port: 8761

spring:
  application:
    name: eserver

eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8761/eureka/
    server:
      wait-time-in-ms-when-sync-empty: 0

logging:
  level:
    com:
      netflix:
        eureka: OFF
        discovery: OFF
  pattern:
    console: "%C{1.} [%-5level] %d{HH:mm:ss} = %msg%n"
