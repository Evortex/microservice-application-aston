version: '3.8'

services:
  order-db:
    image: postgres:15
    container_name: order-db
    restart: always
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_password
    ports:
      - "5433:5432"
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_user -d order_db"]
      interval: 10s
      retries: 5
      start_period: 10s

  payment-db:
    image: postgres:15
    container_name: payment-db
    restart: always
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: payment_password
    ports:
      - "5434:5432"
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_user -d payment_db"]
      interval: 10s
      retries: 5
      start_period: 10s

  ticket-db:
    image: postgres:15
    container_name: ticket-db
    restart: always
    environment:
      POSTGRES_DB: ticket_db
      POSTGRES_USER: ticket_user
      POSTGRES_PASSWORD: ticket_password
    ports:
      - "5435:5432"
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket_user -d ticket_db"]
      interval: 10s
      retries: 5
      start_period: 10s

  zookeeper:
    image: bitnami/zookeeper:latest
    container_name: zookeeper
    restart: always
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    ports:
      - "2181:2181"
    networks:
      - microservices-net

  kafka:
    image: bitnami/kafka:latest
    container_name: kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - ALLOW_PLAINTEXT_LISTENER=yes
    depends_on:
      - zookeeper
    networks:
      - microservices-net

  eureka-server:
    build: ./service-registry
    container_name: eureka-server
    restart: always
    ports:
      - "8762:8762"
    environment:
      - SERVER_PORT=8762
    networks:
      - microservices-net

  config-service:
    build: ./config-service
    container_name: config-service
    restart: always
    ports:
      - "8889:8889"
    environment:
      - SPRING_PROFILES_ACTIVE=default
    depends_on:
      - eureka-server
    networks:
      - microservices-net

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    restart: always
    ports:
      - "8087:8080"
    depends_on:
      - eureka-server
      - config-service
    networks:
      - microservices-net

  order-service:
    build: ./order-service
    container_name: order-service
    restart: always
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://order-db:5432/order_db
      - SPRING_DATASOURCE_USERNAME=order_user
      - SPRING_DATASOURCE_PASSWORD=order_password
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8762/eureka
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-service:8889
    depends_on:
      order-db:
        condition: service_healthy
      kafka:
        condition: service_started
      eureka-server:
        condition: service_started
      config-service:
        condition: service_started
    networks:
      - microservices-net

  payment-service:
    build: ./payment-service
    container_name: payment-service
    restart: always
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://payment-db:5432/payment_db
      - SPRING_DATASOURCE_USERNAME=payment_user
      - SPRING_DATASOURCE_PASSWORD=payment_password
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8762/eureka
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-service:8889
    depends_on:
      payment-db:
        condition: service_healthy
      kafka:
        condition: service_started
      eureka-server:
        condition: service_started
      config-service:
        condition: service_started
    networks:
      - microservices-net

  ticket-service:
    build: ./ticket-service
    container_name: ticket-service
    restart: always
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://ticket-db:5432/ticket_db
      - SPRING_DATASOURCE_USERNAME=ticket_user
      - SPRING_DATASOURCE_PASSWORD=ticket_password
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8762/eureka
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-service:8889
    depends_on:
      ticket-db:
        condition: service_healthy
      kafka:
        condition: service_started
      eureka-server:
        condition: service_started
      config-service:
        condition: service_started
    networks:
      - microservices-net

networks:
  microservices-net:
    driver: bridge
