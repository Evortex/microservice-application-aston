server:
  port: 8086

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        routes:
          - id: order-service
            uri: lb://order-service
            predicates:
              - Path=/orders/**

          - id: ticket-service
            uri: lb://ticket-service
            predicates:
              - Path=/tickets/**

          - id: payment-service
            uri: lb://payment-service
            predicates:
              - Path=/payments/**
        locator:
          enabled: true
          lower-case-service-id: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8081/eureka

logging:
  pattern:
    console: "%C{1.} [%-5level] %d{HH:mm:ss} - %msg%n"
 # API Gateway будет работать на порту 8080


