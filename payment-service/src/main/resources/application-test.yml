server:
  port: 0  # Используем случайный порт для тестов

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  cloud:
    config:
      enabled: false

  kafka:
    bootstrap-servers: "localhost:9092"

eureka:
  client:
    enabled: false
